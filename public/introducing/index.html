<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link href='https://fonts.googleapis.com/css?family=Aboreto' rel='stylesheet'>
    <link rel="shortcut icon" href="../imgs/icon-clean.png" type="image/x-icon">
    <link rel="stylesheet" href="../global-style.css">
    <title>GRHB | Présentation</title>
</head>
<body>
    <header>
        <script>
            $("header").load("../header.html", () => {
                $("#introducing").attr("data-selected", "true");
            });
        </script>
    </header>
    <article>
        <h1 id="introducing-title">Présentation</h1>
        <hr>
        <div id="introducing-content">
            <p><em>Chargement en cours...</em></p>
        </div>
    </article>
    <footer>
        <script>
            $("footer").load("../footer.html"); 
        </script>
    </footer>
    <!--Hidden-->
    <div id="img-zoom-in-bg">
        <div id="img-zoom-in-div">
            <img src="#" id="img-zoom-in">
        </div>
    </div>
    <script src="../zoomOnImage.js"></script>
    <!---------->
    <script>
        $.getJSON("content.json", function(data) {
            if (data.title) {
                $("#introducing-title").text(data.title);
            }
            if (data.content && data.content.trim() !== "") {
                $("#introducing-content").html(data.content);
            } else {
                $("#introducing-content").html("<p>Le contenu de cette page n'a pas encore été défini.</p>");
            }
        }).fail(function() {
            $("#introducing-content").html("<p>Le contenu de cette page n'a pas encore été défini.</p>");
        });
    </script>
</body>
</html>
